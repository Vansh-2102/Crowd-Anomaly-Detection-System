services:
  mysql:
    image: mysql:8.0
    container_name: crowd_anomaly_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crowd_anomaly
      MYSQL_ROOT_PASSWORD: Vansh@2102
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pVansh@2102" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crowd_network

  ml-service:
    build:
      context: ./crowd-anomaly-ml
      dockerfile: Dockerfile
    container_name: crowd_anomaly_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./yolov8m.pt:/app/yolov8m.pt
      - ./yolov8n.pt:/app/yolov8n.pt
      - ./crowd-anomaly-ml/src:/app/src
    env_file:
      - ./crowd-anomaly-ml/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ALERT_INTERVAL=${TELEGRAM_ALERT_INTERVAL:-5}
      - TELEGRAM_SAFE_INTERVAL=${TELEGRAM_SAFE_INTERVAL:-30}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - crowd_network

  backend:
    build:
      context: ./crowd-anomaly-backend
      dockerfile: Dockerfile
    container_name: crowd_anomaly_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=crowd_anomaly
      - DB_USER=root
      - DB_PASSWORD=Vansh@2102
      - ML_SERVICE_HOST=ml-service
      - ML_SERVICE_PORT=8000
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - crowd_network

  frontend:
    build:
      context: ./crowd-anomaly-frontend
      dockerfile: Dockerfile
    container_name: crowd_anomaly_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - crowd_network

volumes:
  mysql_data:

networks:
  crowd_network:
    driver: bridge
