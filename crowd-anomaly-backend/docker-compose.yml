version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: crowd_anomaly_db
    restart: always
    environment:
      MYSQL_DATABASE: crowd_anomaly_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: crowd_anomaly_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=crowd_anomaly_db
      - DB_USER=root
      - DB_PASSWORD=root
      - ML_SERVICE_HOST=host.docker.internal
      - ML_SERVICE_PORT=8000
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
